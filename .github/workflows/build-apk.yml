name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove automatic update check on launch
        run: |
          F=launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java
          sed -i '/AppUpdateManager.checkForUpdates(this, false)/d' "$F"
          if grep -q "checkForUpdates(this, false)" "$F"; then echo "update check still present"; exit 1; fi

      - name: Build release APK
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-home-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
